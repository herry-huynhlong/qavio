# One existing Next.js application; no additional Admin service.
server {
    listen 80;
    server_name qavio.site admin.qavio.site;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qavio-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://$host$request_uri; }
}
server {
    server_name qavio.site;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/qavio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qavio.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/qavio-private/realip.conf;
    if ($qavio_trusted_ingress = 0) { return 403; }
    access_log /var/log/nginx/qavio.access.log qavio_admin_safe;
    error_log /var/log/nginx/qavio.error.log warn;
    client_max_body_size 6m;
    location ~ ^/admin(?:/|$) { return 301 https://admin.qavio.site$request_uri; }
    location ~ ^/api/admin(?:/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Qavio-Client-IP $remote_addr;
        include /etc/nginx/qavio-private/proxy-secret.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_cache off;
    }
}
server {
    server_name admin.qavio.site;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/qavio.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qavio.site/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/qavio-private/realip.conf;
    if ($qavio_trusted_ingress = 0) { return 403; }
    access_log /var/log/nginx/qavio.access.log qavio_admin_safe;
    error_log /var/log/nginx/qavio.error.log warn;
    client_max_body_size 6m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "private, no-store" always;
    location = / { return 302 /admin; }
    location ~ ^/(admin(?:/|$)|api/admin(?:/|$)|media/|_next/|favicon[^/]*$|api/(health|ready)$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Qavio-Client-IP $remote_addr;
        include /etc/nginx/qavio-private/proxy-secret.conf;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 30s;
        proxy_cache off;
    }
    location /api/ { return 404; }
    location / { return 302 https://qavio.site$request_uri; }
}
