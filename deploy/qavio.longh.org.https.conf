# LEGACY rollback reference. Active new host configuration: deploy/qavio.site.conf.
# Enable only after the dedicated certificate has been issued and deployment
# has been confirmed. Keep existing Restaurant and portfolio site files.
server {
    listen 80;
    server_name qavio.longh.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qavio-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://qavio.longh.org$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name qavio.longh.org;

    ssl_certificate /etc/letsencrypt/live/qavio.longh.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qavio.longh.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
