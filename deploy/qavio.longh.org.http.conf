# Bootstrap virtual host for HTTP-01 certificate issuance.
# Install as a NEW site; do not replace longh-sites.
server {
    listen 80;
    server_name qavio.longh.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/qavio-acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
