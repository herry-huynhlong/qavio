name: qavio

services:
  web:
    image: qavio-web:${QAVIO_IMAGE_TAG:-local}
    build:
      context: .
      target: runner
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${QAVIO_HTTP_PORT:-3100}:3000"
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
